<!DOCTYPE html>
<html>
  <head>
    <style>
      body { width: 300px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; text-align: center; margin: 0; padding: 0; }
      
      .header { display: flex; align-items: center; justify-content: center; padding: 15px; border-bottom: 1px solid #e0e0e0; }
      .header img { width: 24px; height: 24px; margin-right: 10px; }
      .header h3 { margin: 0; font-size: 16px; color: #333; }

      .container { padding: 15px; }
      #scanBtn { width: 100%; padding: 12px; background: #007bff; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 600; transition: background-color 0.2s; }
      #scanBtn:hover { background: #0056b3; }
      
      .desc-section { margin-top: 20px; text-align: left; }
      .section-label { font-size: 12px; font-weight: 700; color: #888; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 5px; display: block; }
      #resultDesc { font-size: 14px; color: #444; margin: 0; }

      .tags-section { margin-top: 20px; text-align: left; }
      .tag-container { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
      .tag { font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 20px; white-space: nowrap; }
      
      .neutral { background-color: #f0f0f0; color: #555; }
      .educational { background-color: #d4edda; color: #155724; }
      .graphic { background-color: #f8d7da; color: #721c24; }
    </style>
  </head>
  <body>

    <div class="header">
      <img src="icon.png" alt="App Icon">
      <h3>Loyola University Content Classifier!!!</h3>
    </div>

    <div class="container">
      <button id="scanBtn">Scan This Page</button>
      
      <div id="descSection" class="desc-section" style="display: none;">
        <span class="section-label">Website Description</span>
        <p id="resultDesc">Waiting for scan...</p>
      </div>

      <div id="tagsSection" class="tags-section" style="display: none;">
        <span class="section-label">Content Classifications</span>
        <div id="tagContainer" class="tag-container"></div>
      </div>
    </div>
    
    <script src="content.js"></script> 
  </body>
</html>
